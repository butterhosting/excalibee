services:
  # Creates root-owned directories in the volume before excalibee starts.
  # This simulates a real deployment where bind mounts or pre-existing
  # volumes are owned by root — the scenario where the entrypoint's
  # chown is actually needed.
  init:
    image: alpine
    volumes:
      - excalibee:/opt/excalibee
    command: ["sh", "-c", "mkdir -p /opt/excalibee/data"]

  excalibee:
    image: butterhosting/excalibee:latest
    ports:
      - "3000:3000"
    volumes:
      - excalibee:/opt/excalibee
      - ./.htpasswd:/opt/excalibee/.htpasswd:ro
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  excalibee:
